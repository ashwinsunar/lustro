version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: lustro_db
      POSTGRES_USER: lustro_user
      POSTGRES_PASSWORD: lustro_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DB_HOST=db
      - DB_NAME=lustro_db
      - DB_USER=lustro_user
      - DB_PASS=lustro_password
      - REDIS_HOST=redis

  frontend:
    build: ./frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  postgres_data:
