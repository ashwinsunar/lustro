    /* ===== 3D COLLECTION CAROUSEL ===== */
    #s7.collection-3d {
      --collection-glow-x: 50%;
      position: relative;
      min-height: 100vh;
      padding: 15vh 4vw 10vh;
      overflow: hidden;
      isolation: isolate;
      background:
        radial-gradient(circle at var(--collection-glow-x) 55%, rgba(164,188,220,.15), transparent 26rem),
        linear-gradient(180deg, rgba(4,6,11,.15), rgba(4,6,11,.78));
    }
    #s7.collection-3d::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background:
        radial-gradient(ellipse at 50% 82%, transparent 0 41%, rgba(215,226,242,.32) 41.2% 41.5%, transparent 41.8%),
        radial-gradient(ellipse at 50% 84%, rgba(170,195,226,.09), transparent 38%);
      opacity: .82;
    }
    .collection3d-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 24px;
      margin: 0 2vw 34px;
    }
    .collection3d-title {
      margin: 0;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(42px, 5.3vw, 82px);
      font-weight: 500;
      line-height: .95;
      color: #f2f4f8;
    }
    .collection3d-title em { font-weight: 400; color: #c8d0dd; }
    .collection3d-kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: .42em;
      color: #8b94a6;
      white-space: nowrap;
    }
    .collection3d-stage {
      position: relative;
      height: clamp(570px, 69vh, 760px);
      max-width: 1700px;
      margin: 0 auto;
      perspective: 1500px;
      transform-style: preserve-3d;
      touch-action: pan-y;
      user-select: none;
    }
    .collection3d-track { position: absolute; inset: 0; transform-style: preserve-3d; }
    .collection3d-card {
      --cx: 0px; --cz: 0px; --cry: 0deg; --cscale: 1; --calpha: 1; --cblur: 0px;
      position: absolute;
      top: 50%;
      left: 50%;
      width: clamp(260px, 27vw, 430px);
      min-height: clamp(455px, 58vh, 650px);
      padding: clamp(14px, 1.4vw, 20px);
      overflow: hidden;
      border: 1px solid rgba(210,222,244,.18);
      border-radius: 26px;
      background: linear-gradient(180deg, rgba(11,16,27,.96), rgba(5,9,17,.96));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 30px 80px rgba(0,0,0,.55);
      opacity: var(--calpha);
      filter: blur(var(--cblur)) saturate(calc(.72 + var(--calpha) * .28));
      transform:
        translate(-50%, -50%)
        translateX(var(--cx))
        translateZ(var(--cz))
        rotateY(var(--cry))
        scale(var(--cscale));
      transform-style: preserve-3d;
      will-change: transform, opacity, filter;
      cursor: pointer;
      transition:
        transform 1000ms cubic-bezier(.19,1,.22,1),
        opacity 1000ms cubic-bezier(.19,1,.22,1),
        filter 1000ms cubic-bezier(.19,1,.22,1),
        border-color 300ms ease,
        box-shadow 300ms ease;
    }
    .collection3d-card::after {
      content: '';
      position: absolute;
      inset: -30% -70%;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 43%, rgba(255,255,255,.14) 49%, transparent 55%);
      transform: translateX(-45%);
      opacity: 0;
    }
    .collection3d-card.is-active {
      border-color: rgba(231,239,249,.72);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 42px 110px rgba(0,0,0,.7), 0 0 56px rgba(170,196,228,.16);
      cursor: grab;
    }
    .collection3d-card.is-active::after { opacity: 1; animation: collectionSheen 5.5s ease-in-out infinite; }
    .collection3d-media {
      position: relative;
      height: clamp(255px, 37vh, 410px);
      overflow: hidden;
      border-radius: 17px;
      background: #060b13;
      border: 1px solid rgba(255,255,255,.05);
    }
    .collection3d-media img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      transform: scale(1.02);
      animation: collectionFloat 5.6s ease-in-out infinite;
    }
    .collection3d-media::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 58%, rgba(3,7,13,.52));
      pointer-events: none;
    }
    .collection3d-badge {
      position: absolute; z-index: 2; top: 16px; left: 16px;
      padding: 7px 14px; border-radius: 999px;
      background: #dfe5ee; color: #04060b;
      font: 700 9px/1 'JetBrains Mono', monospace;
      letter-spacing: .24em;
      opacity: 0; transform: translateY(-5px);
      transition: opacity 350ms ease, transform 350ms ease;
    }
    .collection3d-card.is-active .collection3d-badge { opacity: 1; transform: translateY(0); }
    .collection3d-copy { padding: 18px 4px 2px; text-align: center; transition: opacity 500ms ease; }
    .collection3d-card:not(.is-active) .collection3d-copy { opacity: .68; }
    .collection3d-name {
      margin: 0; font-family: 'Cormorant Garamond', serif;
      font-size: clamp(23px, 2vw, 32px); font-weight: 500; color: #f2f4f8;
    }
    .collection3d-desc { margin: 8px 0 0; font-size: 12px; color: #9aa3b2; }
    .collection3d-price { margin: 15px 0 0; font: 500 14px/1 'JetBrains Mono', monospace; letter-spacing: .12em; color: #dfe5ee; }
    .collection3d-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; margin-top: 20px; }
    .collection3d-action {
      display: flex; align-items: center; justify-content: center;
      min-height: 46px; border-radius: 999px; cursor: pointer;
      font: 600 9px/1 'JetBrains Mono', monospace; letter-spacing: .2em; text-transform: uppercase;
      transition: transform 220ms ease, background 220ms ease, border-color 220ms ease;
    }
    .collection3d-action:hover { transform: translateY(-2px); }
    .collection3d-action.primary { color: #04060b; background: #dfe5ee; }
    .collection3d-action.secondary { color: #dfe5ee; border: 1px solid rgba(210,222,244,.22); }
    .collection3d-card:not(.is-active) .collection3d-actions { opacity: .48; transform: scale(.94); }
    .collection3d-nav {
      display: grid; grid-template-columns: auto minmax(180px, 430px) auto;
      align-items: center; justify-content: center; gap: clamp(18px, 4vw, 50px);
      margin-top: -12px;
    }
    .collection3d-arrow {
      width: 66px; height: 66px; border-radius: 50%;
      border: 1px solid rgba(210,222,244,.25); background: rgba(255,255,255,.025);
      color: #eef1f6; font-size: 25px; cursor: pointer;
      transition: background 220ms ease, border-color 220ms ease, transform 220ms ease;
    }
    .collection3d-arrow:hover { transform: scale(1.04); background: rgba(255,255,255,.07); border-color: rgba(230,238,250,.55); }
    .collection3d-indicator { display: grid; justify-items: center; gap: 14px; }
    .collection3d-count { font-family: 'Cormorant Garamond', serif; font-size: 30px; color: #eef1f6; }
    .collection3d-count span { color: #596271; font-size: .7em; }
    .collection3d-progress { width: min(100%, 420px); height: 2px; background: rgba(210,222,244,.18); overflow: hidden; }
    .collection3d-progress i { display: block; height: 100%; width: 25%; background: #dfe5ee; transition: width 700ms cubic-bezier(.19,1,.22,1); }
    .collection3d-hint { font: 600 9px/1 'JetBrains Mono', monospace; letter-spacing: .45em; color: #6d7686; }
    @keyframes collectionFloat { 0%,100%{transform:translateY(-2px) scale(1.02)} 50%{transform:translateY(5px) scale(1.02)} }
    @keyframes collectionSheen { 0%,20%{transform:translateX(-45%)} 55%,100%{transform:translateX(45%)} }
    @media (max-width: 820px) {
      #s7.collection-3d { padding: 12vh 16px 9vh; }
      .collection3d-head { display: grid; margin-inline: 4px; }
      .collection3d-kicker { white-space: normal; line-height: 1.7; }
      .collection3d-stage { height: 610px; perspective: 1050px; }
      .collection3d-card { width: min(82vw, 335px); min-height: 495px; }
      .collection3d-actions { grid-template-columns: 1fr; }
      .collection3d-nav { grid-template-columns: auto 1fr auto; gap: 10px; }
      .collection3d-arrow { width: 52px; height: 52px; }
    }

    &lt;article class=&quot;quote&quot; data-quote=&quot;1&quot;&gt;&lt;div class=&quot;stars&quot;&gt;★★★★★&lt;/div&gt;&lt;p class=&quot;copy&quot;&gt;The finishing feels unusually calm. Every surface has purpose, and the movement becomes more interesting the longer you live with it.&lt;/p&gt;&lt;div class=&quot;person&quot;&gt;&lt;div&gt;&lt;div class=&quot;name&quot;&gt;Elena Rossi&lt;/div&gt;&lt;div class=&quot;role&quot;&gt;CURATOR · MILAN&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ref&quot;&gt;REF. AG-2100-BC&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;

    &lt;article class=&quot;quote&quot; data-quote=&quot;3&quot;&gt;&lt;div class=&quot;stars&quot;&gt;★★★★★&lt;/div&gt;&lt;p class=&quot;copy&quot;&gt;The most impressive part is restraint. Nothing is added simply to decorate. It feels designed to stay relevant for decades.&lt;/p&gt;&lt;div class=&quot;person&quot;&gt;&lt;div&gt;&lt;div class=&quot;name&quot;&gt;Sofia Lindberg&lt;/div&gt;&lt;div class=&quot;role&quot;&gt;CREATIVE DIRECTOR · STOCKHOLM&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;ref&quot;&gt;REF. AG-1602-CL&lt;/div&gt;&lt;/div&gt;&lt;/article&gt;

        { k: 'Case', v: '40 mm · polished 904L steel' },
        { k: 'Movement', v: 'Calibre AG-70 · automatic' },
        { k: 'Complications', v: 'Open heart · small seconds' },
        { k: 'Power reserve', v: '68 hours' },
        { k: 'Bracelet', v: '904L steel, micro-adjust clasp' },
        { k: 'Water resistance', v: '5 ATM' },
        { k: 'Crystal', v: 'Double-domed sapphire' },
      ],
    },
    'AG-1602-CL': {
      name: 'Argentum Classic Leather', price: 12900,
      desc: 'Time only, 38 millimetres, hand-stitched calf. The quietest watch in the collection — and the one our watchmakers wear.',
      specs: [
        { k: 'Case', v: '38 mm · brushed 904L steel' },
        { k: 'Movement', v: 'Calibre AG-60 · automatic' },
        { k: 'Complications', v: 'None — hours, minutes, seconds' },
        { k: 'Power reserve', v: '60 hours' },
        { k: 'Strap', v: 'Hand-stitched calf leather' },
        { k: 'Water resistance', v: '5 ATM' },
        { k: 'Crystal', v: 'Domed sapphire' },
      ],
    },
  };

  componentDidMount() {
    this.smooth = this.props.scrubSmoothing ?? 0.14;
    this.dustSpeed = 1;
    this.$ = (id) =&gt; document.getElementById(id);
    this.vids = {};
    ['v1', 'v2', 'v5', 'v8', 'v11'].forEach((id) =&gt; {
      const el = this.$(id);
      if (el) { el.muted = true; el.pause(); this.vids[id] = { el, cur: 0 }; }
    });
    // ambient loop video: only decode while on screen
    const v3 = this.$('v3');
    if (v3) {
      v3.muted = true;
      const io3 = new IntersectionObserver((es) =&gt; {
        es.forEach((e) =&gt; { if (e.isIntersecting) v3.play().catch(() =&gt; {}); else v3.pause(); });
      }, { rootMargin: '200px' });
      io3.observe(v3);
    }

    this.splitWords();
    this.setupParticles();
    this.setupCards();
    this.setupVariants();
    this.setupCartButtons();
    this.cacheDom();
    this.measure();
    // re-measure after late layout shifts (fonts, images)
    setTimeout(() =&gt; this.measure(), 2000);
    setTimeout(() =&gt; this.measure(), 6000);
    this.onResize = () =&gt; { this.sizeCanvas(); this.measure(); };
    window.addEventListener('resize', this.onResize);
    this.raf = requestAnimationFrame(this.tick);
  }

  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    window.removeEventListener('resize', this.onResize);
  }

  // ---------- helpers ----------
  clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  sub(p, a, b) { return this.clamp((p - a) / (b - a), 0, 1); }
  ez(t) { return 1 - Math.pow(1 - t, 3); }
  prog(id) {
    const m = this.metrics &amp;&amp; this.metrics[id];
    if (m) return this.clamp((window.scrollY - m.top) / Math.max(1, m.h - window.innerHeight), 0, 1);
    const el = this.$(id);
    if (!el) return 0;
    const r = el.getBoundingClientRect();
    const total = el.offsetHeight - window.innerHeight;
    return this.clamp(-r.top / Math.max(1, total), 0, 1);
  }
  // cached section geometry — avoids per-frame getBoundingClientRect
  measure() {
    this.metrics = {};
    ['s1', 's2', 's3', 's4', 's5', 's6', 's11', 's9', 's10', 's8'].forEach((id) =&gt; {
      const el = this.$(id);
      if (!el) return;
      const r = el.getBoundingClientRect();
      this.metrics[id] = { top: r.top + window.scrollY, h: el.offsetHeight };
    });
    const track = this.$('track');
    this.trackMax = track ? Math.max(0, track.scrollWidth - window.innerWidth) : 0;
  }
  // section near viewport? sections outside are skipped entirely each frame
  vis(id, sy, vh) {
    const m = this.metrics &amp;&amp; this.metrics[id];
    if (!m) return true;
    const pad = vh * 0.6;
    return sy + vh + pad &gt; m.top &amp;&amp; sy - pad &lt; m.top + m.h;
  }
  // one-time DOM caches with pre-parsed data attributes
  cacheDom() {
    const q = (sel) =&gt; Array.from(document.querySelectorAll(sel));
    this.dom = {
      panels: q('#s2 [data-panel]').map((el) =&gt; ({
        el, i: +el.getAttribute('data-panel'), dx: +el.getAttribute('data-dx'),
        dy: +el.getAttribute('data-dy'), spd: +el.getAttribute('data-spd'),
        lines: Array.from(el.querySelectorAll('[data-line]')),
      })),
      bento: q('#s4 [data-bento]').map((el) =&gt; ({
        el, i: +el.getAttribute('data-bento'), tx: +el.getAttribute('data-tx'),
        ty: +el.getAttribute('data-ty'), rz: +el.getAttribute('data-rz'),
      })),
      specs: q('#s5 [data-spec]'),
      steps: q('#s6 [data-steptitle]'),
      acards: q('#s11 [data-acard]'),
      quotes: q('#s9 [data-quote]'),
      qticks: q('#s9 [data-qtick]'),
      miles: q('#s10 [data-mile]'),
    };
  }
  scrub(key, p) {
    const v = this.vids[key];
    if (!v || v.el.readyState &lt; 1 || !isFinite(v.el.duration)) return;
    const target = p * Math.max(0, v.el.duration - 0.08);
    v.cur += (target - v.cur) * this.smooth;
    if (Math.abs(v.el.currentTime - v.cur) &gt; 0.008) {
      try { v.el.currentTime = v.cur; } catch (e) {}
    }
  }

  // ---------- setup ----------
  splitWords() {
    const h = this.$('s3h');
    if (!h) return;
    const words = h.textContent.trim().split(/\s+/);
    h.textContent = '';
    this.s3words = words.map((w, i) =&gt; {
      const s = document.createElement('span');
      s.textContent = w;
      s.style.cssText = 'display:inline-block;margin-right:0.26em;opacity:0.15;filter:blur(6px);transform:translateY(22px);will-change:transform,opacity,filter;';
      h.appendChild(s);
      return s;
    });
    const p = this.$('s3p');
    if (p) { p.style.clipPath = 'inset(0 0 100% 0)'; p.style.opacity = '0'; }
  }

  setupParticles() {
    const c = this.$('dust');
    if (!c) return;
    this.dustCtx = c.getContext('2d');
    this.sizeCanvas();
    const n = 64;
    this.parts = Array.from({ length: n }, () =&gt; ({
      x: Math.random(), y: Math.random(),
      r: Math.random() &lt; 0.14 ? 5 + Math.random() * 11 : 0.5 + Math.random() * 1.8,
      a: 0.03 + Math.random() * 0.12,
      vx: (Math.random() - 0.5) * 0.00012,
      vy: -0.00004 - Math.random() * 0.00012,
      tw: Math.random() * Math.PI * 2,
    }));
  }
  sizeCanvas() {
    const c = this.$('dust');
    if (!c) return;
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  }
  drawParticles(t) {
    if (!this.dustCtx || (this.props.particles === false)) return;
    const ctx = this.dustCtx, w = ctx.canvas.width, h = ctx.canvas.height;
    ctx.clearRect(0, 0, w, h);
    const sp = this.dustSpeed;
    for (const p of this.parts) {
      p.x += p.vx * sp * 16; p.y += p.vy * sp * 16;
      if (p.y &lt; -0.05) { p.y = 1.05; p.x = Math.random(); }
      if (p.x &lt; -0.05) p.x = 1.05; if (p.x &gt; 1.05) p.x = -0.05;
      const tw = 0.7 + 0.3 * Math.sin(t * 0.0008 + p.tw);
      const big = p.r &gt; 4;
      if (big) {
        const g = ctx.createRadialGradient(p.x * w, p.y * h, 0, p.x * w, p.y * h, p.r * 3);
        g.addColorStop(0, 'rgba(175,195,230,' + (p.a * tw * 0.5) + ')');
        g.addColorStop(1, 'rgba(175,195,230,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(p.x * w, p.y * h, p.r * 3, 0, 7); ctx.fill();
      } else {
        ctx.fillStyle = 'rgba(200,215,240,' + (p.a * tw) + ')';
        ctx.beginPath(); ctx.arc(p.x * w, p.y * h, p.r, 0, 7); ctx.fill();
      }
    }
  }

  // ---------- cart ----------
  fmt(n) { return 'CHF ' + n.toLocaleString('en-US'); }

  setupCartButtons() {
    document.querySelectorAll('[data-add]').forEach((el) =&gt; {
      el.addEventListener('click', () =&gt; this.addToCart(el.getAttribute('data-add')));
    });
  }

  addToCart(ref) {
    const p = this.products[ref];
    if (!p) return;
    this.setState((s) =&gt; {
      const cart = s.cart.map((it) =&gt; ({ ...it }));
      const ex = cart.find((it) =&gt; it.ref === ref);
      if (ex) ex.qty += 1; else cart.push({ ref, name: p.name, price: p.price, qty: 1 });
      return { cart };
    });
    this.showToast(p.name.toUpperCase() + ' — ADDED TO CART');
  }

  changeQty(ref, d) {
    this.setState((s) =&gt; ({
      cart: s.cart
        .map((it) =&gt; (it.ref === ref ? { ...it, qty: it.qty + d } : { ...it }))
        .filter((it) =&gt; it.qty &gt; 0),
    }));
  }

  removeItem(ref) {
    this.setState((s) =&gt; ({ cart: s.cart.filter((it) =&gt; it.ref !== ref) }));
  }

  openCart() {
    const ov = this.$('cartoverlay'), dr = this.$('cartdrawer');
    if (ov) { ov.style.opacity = '1'; ov.style.pointerEvents = 'auto'; }
    if (dr) dr.style.transform = 'translateX(0%)';
  }

  closeCart() {
    const ov = this.$('cartoverlay'), dr = this.$('cartdrawer');
    if (ov) { ov.style.opacity = '0'; ov.style.pointerEvents = 'none'; }
    if (dr) dr.style.transform = 'translateX(112%)';
  }

  showToast(msg) {
    const t = this.$('toast');
    if (!t) return;
    t.textContent = msg;
    t.style.opacity = '1';
    t.style.transform = 'translateX(-50%) translateY(0px)';
    clearTimeout(this.toastT);
    this.toastT = setTimeout(() =&gt; {
      t.style.opacity = '0';
      t.style.transform = 'translateX(-50%) translateY(20px)';
    }, 2300);
  }

  checkout() {
    if (this.state.cart.length === 0) { this.showToast('YOUR CART IS EMPTY'); return; }
    this.setState({ confirmed: true });
    this.showToast('ORDER REQUEST SENT — OUR CONCIERGE WILL CONTACT YOU');
    clearTimeout(this.confirmT);
    this.confirmT = setTimeout(() =&gt; this.setState({ confirmed: false }), 3000);
  }

  setupCards() {
    const cards = Array.from(document.querySelectorAll('[data-card]'));
    cards.forEach((el, i) =&gt; {
      el.style.opacity = '0';
      el.style.transform = 'translateY(90px) scale(0.97)';
    });
    const io = new IntersectionObserver((entries) =&gt; {
      entries.forEach((en) =&gt; {
        if (!en.isIntersecting) return;
        const el = en.target;
        const i = +el.getAttribute('data-card');
        el.style.transition = 'opacity 1s cubic-bezier(0.4, 0, 0.2, 1) ' + (i * 120) + 'ms, transform 1s cubic-bezier(0.4, 0, 0.2, 1) ' + (i * 120) + 'ms';
        el.style.opacity = '1';
        el.style.transform = 'translateY(0) scale(1)';
        io.unobserve(el);
        setTimeout(() =&gt; { el.style.transition = 'box-shadow 400ms ease, border-color 400ms ease'; }, 1300 + i * 120);
      });
    }, { threshold: 0.15 });
    cards.forEach((el) =&gt; io.observe(el));
    // hover tilt + glow
    cards.forEach((el) =&gt; {
      const glow = el.querySelector('[data-cardglow]');
      const img = el.querySelector('[data-cardimg]');
      el.addEventListener('mousemove', (e) =&gt; {
        const r = el.getBoundingClientRect();
        const nx = (e.clientX - r.left) / r.width - 0.5;
        const ny = (e.clientY - r.top) / r.height - 0.5;
        el.style.transform = 'perspective(900px) rotateX(' + (-ny * 5) + 'deg) rotateY(' + (nx * 6) + 'deg) translateY(-4px)';
        if (glow) {
          glow.style.opacity = '1';
          glow.style.background = 'radial-gradient(circle 240px at ' + ((nx + 0.5) * 100) + '% ' + ((ny + 0.5) * 100) + '%, rgba(160,185,225,0.14), rgba(160,185,225,0) 70%)';
        }
        if (img) img.style.transform = 'translateZ(30px) scale(1.03)';
      });
      el.addEventListener('mouseleave', () =&gt; {
        el.style.transform = 'perspective(900px) rotateX(0) rotateY(0) translateY(0)';
        if (glow) glow.style.opacity = '0';
        if (img) img.style.transform = 'translateZ(0) scale(1)';
      });
    });
  }

  setupVariants() {
    const chips = Array.from(document.querySelectorAll('[data-variant]'));
    const labels = ['360° · SCROLL TO ROTATE', 'SILVER CASE · STEEL BRACELET', 'MOONPHASE DIAL · MACRO'];
    chips.forEach((chip) =&gt; {
      chip.addEventListener('click', () =&gt; {
        const i = +chip.getAttribute('data-variant');
        chips.forEach((c) =&gt; {
          c.style.background = 'rgba(8,12,22,0.5)';
          c.style.color = '#9aa3b2';
          c.style.borderColor = 'rgba(210,222,244,0.16)';
        });
        chip.style.background = '#dfe5ee';
        chip.style.color = '#04060b';
        chip.style.borderColor = 'rgba(210,222,244,0.3)';
        const i1 = this.$('varimg1'), i2 = this.$('varimg2'), lb = this.$('varlabel');
        if (i1) i1.style.opacity = i === 1 ? '1' : '0';
        if (i2) i2.style.opacity = i === 2 ? '1' : '0';
        if (lb) lb.textContent = labels[i] || labels[0];
      });
    });
  }

  // ---------- frame loop ----------
  tick = (t) =&gt; {
    const sy = window.scrollY;
    const vh = window.innerHeight;
    const D = this.dom || {};

    // nav — write only when state flips
    const navOn = sy &gt; 60;
    if (navOn !== this._navOn) {
      this._navOn = navOn;
      const nav = this.$('nav');
      if (nav) {
        nav.style.background = navOn ? 'rgba(5,8,14,0.6)' : 'rgba(4,6,11,0)';
        nav.style.backdropFilter = navOn ? 'blur(20px) saturate(140%)' : 'none';
        nav.style.borderBottomColor = navOn ? 'rgba(210,222,244,0.1)' : 'rgba(210,222,244,0)';
      }
    }

    // S1 hero
    if (this.vis('s1', sy, vh)) {
      const p1 = this.prog('s1');
      this.scrub('v1', this.sub(p1, 0, 0.88));
      const v1 = this.vids.v1 &amp;&amp; this.vids.v1.el;
      if (v1) v1.style.transform = 'scale(' + (1 + this.ez(p1) * 0.3) + ') rotate(' + (this.ez(p1) * 4) + 'deg) translateY(' + (Math.sin(t * 0.0006) * 5) + 'px)';
      const fade1 = this.$('fade1');
      if (fade1) fade1.style.opacity = this.sub(p1, 0.9, 1);
      const d = this.ez(this.sub(p1, 0.04, 0.6));
      const fadeH = 1 - this.sub(p1, 0.5, 0.82);
      const h1a = this.$('h1a'), h1b = this.$('h1b');
      if (h1a) { h1a.style.transform = 'translateX(' + (-d * 30) + 'vw)'; h1a.style.opacity = fadeH; }
      if (h1b) { h1b.style.transform = 'translateX(' + (d * 30) + 'vw)'; h1b.style.opacity = fadeH; }
      const eb = this.$('s1eyebrow');
      if (eb) eb.style.opacity = 1 - this.sub(p1, 0.03, 0.2);
      const s1sub = this.$('s1sub');
      if (s1sub) {
        const k = this.sub(p1, 0.03, 0.26);
        s1sub.style.opacity = 1 - k;
        s1sub.style.transform = 'translateY(' + (-k * 90) + 'px)';
        s1sub.style.pointerEvents = k &gt; 0.5 ? 'none' : 'auto';
      }
      const dark = this.$('s1dark');
      if (dark) dark.style.opacity = 0.3 + this.sub(p1, 0.3, 1) * 0.55;
      const hint = this.$('s1hint');
      if (hint) hint.style.opacity = 1 - this.sub(p1, 0.01, 0.1);
    }

    // S2 macro
    if (this.vis('s2', sy, vh)) {
      const p2 = this.prog('s2');
      this.scrub('v2', p2);
      const v2 = this.vids.v2 &amp;&amp; this.vids.v2.el;
      if (v2) v2.style.transform = 'scale(' + (1.28 - this.ez(p2) * 0.22) + ') rotate(' + ((1 - this.ez(this.sub(p2, 0, 0.35))) * -4) + 'deg)';
      const fade2 = this.$('fade2');
      if (fade2) fade2.style.opacity = this.clamp((1 - this.sub(p2, 0, 0.08)) + this.sub(p2, 0.94, 1), 0, 1);
      const s2t = this.$('s2title');
      if (s2t) {
        const k = this.sub(p2, 0.02, 0.14);
        s2t.style.opacity = k * (1 - this.sub(p2, 0.85, 1));
        s2t.style.transform = 'translateY(' + ((1 - k) * 30) + 'px)';
      }
      (D.panels || []).forEach((pn) =&gt; {
        const start = 0.1 + pn.i * 0.11;
        const k = this.ez(this.sub(p2, start, start + 0.26));
        const par = (p2 - 0.5) * pn.spd * -70;
        pn.el.style.opacity = k;
        pn.el.style.transform = 'translate(' + (pn.dx * (1 - k)) + 'px,' + (pn.dy * (1 - k) + par) + 'px) scale(' + (0.93 + 0.07 * k) + ')';
        pn.lines.forEach((ln, j) =&gt; {
          const lk = this.sub(p2, start + 0.06 + j * 0.045, start + 0.16 + j * 0.045);
          ln.style.opacity = 0.05 + 0.95 * lk;
          ln.style.transform = 'translateY(' + ((1 - lk) * 14) + 'px)';
        });
      });
    }

    // S3 editorial
    if (this.vis('s3', sy, vh)) {
      const p3 = this.prog('s3');
      if (this.s3words) {
        this.s3words.forEach((s, i) =&gt; {
          const k = this.sub(p3, 0.04 + i * 0.05, 0.2 + i * 0.05);
          s.style.opacity = 0.15 + 0.85 * k;
          s.style.filter = 'blur(' + ((1 - k) * 6) + 'px)';
          s.style.transform = 'translateY(' + ((1 - k) * 22) + 'px)';
          s.style.color = k &gt; 0.65 ? '#f6f8fb' : '#8b94a6';
        });
      }
      const s3p = this.$('s3p');
      if (s3p) {
        const k = this.ez(this.sub(p3, 0.58, 0.82));
        s3p.style.clipPath = 'inset(0 0 ' + ((1 - k) * 100) + '% 0)';
        s3p.style.opacity = k;
      }
      const s3vis = this.$('s3vis');
      if (s3vis) s3vis.style.transform = 'translateY(' + ((0.5 - p3) * 90) + 'px)';
      // camera push-in toward the dial
      const v3el = this.$('v3');
      if (v3el) v3el.style.transform = 'scale(' + (1.3 + this.ez(p3) * 0.45) + ')';
    }

    // S4 bento
    if (this.vis('s4', sy, vh)) {
      const p4 = this.prog('s4');
      const s4h = this.$('s4head');
      if (s4h) {
        const k = this.sub(p4, 0.02, 0.14);
        s4h.style.opacity = k;
        s4h.style.transform = 'translateY(' + ((1 - k) * 26) + 'px)';
      }
      (D.bento || []).forEach((b) =&gt; {
        const k = this.ez(this.sub(p4, 0.06 + b.i * 0.055, 0.34 + b.i * 0.055));
        b.el.style.opacity = 0.05 + 0.95 * k;
        b.el.style.transform = 'translate3d(' + (b.tx * (1 - k)) + 'px,' + (b.ty * (1 - k)) + 'px,' + ((1 - k) * -180) + 'px) rotateZ(' + (b.rz * (1 - k)) + 'deg)';
      });
    }

    // S5 showcase
    if (this.vis('s5', sy, vh)) {
      const p5 = this.prog('s5');
      this.scrub('v5', p5);
      const glow = this.$('s5glow');
      if (glow) glow.style.opacity = 0.4 + 0.6 * Math.abs(Math.sin(p5 * Math.PI));
      const frame = this.$('s5frame');
      if (frame &amp;&amp; frame.style.transform) frame.style.transform = '';
      // cinematic light sweep across the watch
      const sw = this.$('s5sweep');
      if (sw) sw.style.transform = 'translateX(' + (-130 + this.ez(this.sub(p5, 0.15, 0.75)) * 260) + '%)';
      // split text opens around the product
      const ta = this.$('s5ta'), tb = this.$('s5tb');
      if (ta &amp;&amp; tb) {
        const open = this.ez(this.sub(p5, 0.02, 0.4));
        const px = open * Math.min(220, window.innerWidth * 0.12);
        ta.style.transform = 'translateX(' + (-40 - px) + 'px)';
        tb.style.transform = 'translateX(' + (40 + px) + 'px)';
        ta.style.opacity = 0.25 + open * 0.75;
        tb.style.opacity = 0.25 + open * 0.75;
      }
      (D.specs || []).forEach((el, i) =&gt; {
        const k = this.ez(this.sub(p5, 0.06 + i * 0.09, 0.2 + i * 0.09));
        el.style.opacity = k;
        el.style.transform = 'translateY(' + ((1 - k) * 36) + 'px)';
      });
      const price = this.$('s5price');
      if (price) price.style.opacity = this.sub(p5, 0.72, 0.88);
    }

    // S6 timeline
    if (this.vis('s6', sy, vh)) {
      const p6 = this.prog('s6');
      const track = this.$('track');
      if (track) track.style.transform = 'translateX(' + (-p6 * (this.trackMax || 0)) + 'px)';
      (D.steps || []).forEach((el, i) =&gt; {
        const k = this.sub(p6, i / 7, i / 7 + 0.1);
        el.style.transform = 'translateY(' + ((1 - k) * 110) + '%)';
      });
    }

    // S11 assembly film
    if (this.vis('s11', sy, vh)) {
      const p11 = this.prog('s11');
      this.scrub('v11', p11);
      const v11 = this.vids.v11 &amp;&amp; this.vids.v11.el;
      if (v11) v11.style.transform = 'scale(' + (1.02 + this.ez(p11) * 0.08) + ')';
      const fade11 = this.$('fade11');
      if (fade11) fade11.style.opacity = this.clamp((1 - this.sub(p11, 0, 0.08)) + this.sub(p11, 0.94, 1), 0, 1);
      // crosshair lines draw in
      const vl = this.$('s11vline'), hl = this.$('s11hline');
      if (vl) vl.style.transform = 'scaleY(' + this.ez(this.sub(p11, 0.03, 0.2)) + ')';
      if (hl) hl.style.transform = 'scaleX(' + this.ez(this.sub(p11, 0.06, 0.24)) + ')';
      // headline: rises in, drifts up slowly (parallax), never fully leaves
      const s11t = this.$('s11title');
      if (s11t) {
        const kin = this.ez(this.sub(p11, 0.04, 0.18));
        s11t.style.opacity = kin;
        s11t.style.transform = 'translateY(' + ((1 - kin) * 50 - this.sub(p11, 0.2, 1) * 60) + 'px)';
      }
      // intro paragraph: fades in after headline, drifts slower
      const s11i = this.$('s11intro');
      if (s11i) {
        const kin = this.ez(this.sub(p11, 0.12, 0.26));
        s11i.style.opacity = kin;
        s11i.style.transform = 'translateY(' + ((1 - kin) * 34 - this.sub(p11, 0.26, 1) * 30) + 'px)';
      }
      // numbered cards drift up through quadrants at different speeds
      (D.acards || []).forEach((el, i) =&gt; {
        // staggered windows: each card fades out as the next settles (max ~2 visible)
        const start = 0.28 + i * 0.2;
        const kin = this.ez(this.sub(p11, start, start + 0.14));
        const kout = i === 2 ? this.sub(p11, 0.9, 1) : this.ez(this.sub(p11, start + 0.24, start + 0.36));
        const drift = this.sub(p11, start, 1) * (70 + i * 15);
        el.style.opacity = kin * (1 - kout);

        el.style.pointerEvents = kin &gt; 0.5 &amp;&amp; kout &lt; 0.5 ? 'auto' : 'none';
      });
    }

    // S9 testimonials
    if (this.vis('s9', sy, vh)) {
      const p9 = this.prog('s9');
      const quotes = D.quotes || [];
      let activeQ = 0, bestD = 1e9;
      const R = vh * 0.30;
      const step = 38;
      const rot = p9 * step * (quotes.length - 1);
      quotes.forEach((el, i) =&gt; {
        const th = i * step - rot;
        const ad = Math.abs(th);
        if (ad &lt; bestD) { bestD = ad; activeQ = i; }
        const k = this.clamp(ad / 40, 0, 1);
        el.style.opacity = 1 - this.ez(k);
        el.style.transform =
          'translate(-50%, -50%) rotate(' + th + 'deg) translateY(' + (-R) + 'px) rotate(' + (-th) + 'deg) scale(' + (1 - 0.1 * k) + ')';
        el.style.filter = 'blur(' + (k * 7) + 'px)';
        el.style.pointerEvents = ad &lt; 12 ? 'auto' : 'none';
      });
      if (activeQ !== this._activeQ) {
        this._activeQ = activeQ;
        (D.qticks || []).forEach((el, i) =&gt; {
          el.style.background = i === activeQ ? 'rgba(223,229,238,0.9)' : 'rgba(210,222,244,0.18)';
        });
      }
    }

    // S10 heritage
    if (this.vis('s10', sy, vh)) {
      const p10 = this.prog('s10');
      const yn = this.$('yearnum');
      if (yn) {
        const txt = String(Math.round(1948 + this.ez(p10) * (2026 - 1948)));
        if (yn.textContent !== txt) yn.textContent = txt;
      }
      const yb = this.$('yearbar');
      if (yb) yb.style.width = (p10 * 100) + '%';
      const yl = this.$('yearlab');
      if (yl) {
        const labs = ['ATELIER FOUNDED · GENEVA', 'CALIBRE AG-31 · FIRST MOONPHASE', 'CASE MANUFACTURE · IN-HOUSE', 'CALIBRE AG-72 · THE OPEN HEART'];
        const li = Math.min(3, Math.floor(p10 * 4));
        if (yl.textContent !== labs[li]) yl.textContent = labs[li];

      (D.miles || []).forEach((el, i) =&gt; {
        const c = (i + 0.5) / 4;
        const k = Math.max(0, 1 - Math.abs(p10 - c) * 3.4);
        el.style.opacity = k;
        el.style.transform = 'translateY(' + ((1 - k) * 26) + 'px)';
      });

    // S8 final
    if (this.vis('s8', sy, vh)) {
      const p8 = this.prog('s8');
      this.dustSpeed = 1 - this.sub(p8, 0.3, 1) * 0.75;

      const fade8 = this.$('fade8');
      if (fade8) fade8.style.opacity = 1 - this.sub(p8, 0, 0.1);
      const s8h = this.$('s8h');
      if (s8h) {
        const k = this.sub(p8, 0.12, 0.42);
        s8h.style.opacity = k;
        s8h.style.filter = 'blur(' + ((1 - k) * 12) + 'px)';
      }
      const s8sub = this.$('s8sub');
      if (s8sub) {
        const k = this.sub(p8, 0.28, 0.52);
        s8sub.style.opacity = k;
        s8sub.style.transform = 'translateY(' + ((1 - k) * 26) + 'px)';
      }
      const s8cta = this.$('s8cta');
      if (s8cta) {
        const k = this.ez(this.sub(p8, 0.4, 0.66));
        s8cta.style.opacity = k;
        s8cta.style.transform = 'translateY(' + ((1 - k) * 50) + 'px)';
      }
      const ring = this.$('ring');
      if (ring) {
        const k = this.sub(p8, 0.3, 0.95);
        ring.style.opacity = Math.min(1, k * 1.6) * 0.85;
        ring.style.transform = 'translate(-50%, -50%) scale(' + (0.55 + k * 0.5) + ')';
      }
    } else if (this.dustSpeed !== 1) {
      this.dustSpeed = 1;
    }

    this.drawParticles(t);
    this.raf = requestAnimationFrame(this.tick);
  };

  renderVals() {
    const cart = this.state.cart;
    const count = cart.reduce((a, c) =&gt; a + c.qty, 0);
    const subtotal = cart.reduce((a, c) =&gt; a + c.qty * c.price, 0);
    return {
      cartCount: count,
      cartEmpty: cart.length === 0,
      cartItems: cart.map((it) =&gt; ({
        ref: it.ref,
        name: it.name,
        qty: it.qty,
        lineTotal: this.fmt(it.price * it.qty),
        inc: () =&gt; this.changeQty(it.ref, 1),
        dec: () =&gt; this.changeQty(it.ref, -1),
        remove: () =&gt; this.removeItem(it.ref),

      cartSubtotal: this.fmt(subtotal),
      detailOpen: !!this.state.detail,
      detailRef: this.state.detail || '',

      detailDesc: (this.state.detail &amp;&amp; this.products[this.state.detail].desc) || '',
      detailPrice: this.state.detail ? this.fmt(this.products[this.state.detail].price) : '',

      viewOS: () =&gt; this.setState({ detail: 'AG-1877-OS' }),
      viewCL: () =&gt; this.setState({ detail: 'AG-1602-CL' }),
      openCart: () =&gt; this.openCart(),
      closeCart: () =&gt; this.closeCart(),
      checkout: () =&gt; this.checkout(),
      checkoutLabel: this.state.confirmed ? 'Request Received ✓' : 'Proceed to Checkout',
    };
  }
}

&lt;script&gt;
(function () {
  function initCollectionCarousel() {
    const section = document.getElementById('s7');
    const stage = document.getElementById('collectionStage');
    const track = document.getElementById('collectionTrack');
    const prev = document.getElementById('collectionPrev');
    const next = document.getElementById('collectionNext');
    const current = document.getElementById('collectionCurrent');
    const progress = document.getElementById('collectionProgress');

    if (!section || !stage || !track || !prev || !next || !current || !progress) {
      window.setTimeout(initCollectionCarousel, 100);
      return;
    }

    if (stage.__collectionReady) return;
    stage.__collectionReady = true;

    const cards = Array.from(track.querySelectorAll('[data-collection-card]'));
    if (!cards.length) return;

    let active = 0;
    let pointerId = null;
    let startX = 0;
    let moved = false;
    let lastWheel = 0;

    function circularOffset(index) {
      let offset = index - active;
      const half = cards.length / 2;
      if (offset &gt; half) offset -= cards.length;
      if (offset &lt; -half) offset += cards.length;
      return offset;
    }

    function updateCarousel() {
      const width = Math.max(stage.clientWidth, window.innerWidth * 0.8);
      const mobile = window.innerWidth &lt; 760;
      const radiusX = mobile ? Math.min(width * 0.43, 285) : Math.min(width * 0.37, 520);
      const depthStep = mobile ? 115 : 185;

      cards.forEach((card, index) =&gt; {
        const offset = circularOffset(index);
        const distance = Math.abs(offset);
        const direction = Math.sign(offset);
        const x = offset === 0 ? 0 : direction * radiusX * Math.min(1, 0.72 + distance * 0.18);
        const z = offset === 0 ? 80 : -distance * depthStep;
        const rotateY = offset === 0 ? 0 : -direction * Math.min(58, 27 + distance * 12);
        const scale = offset === 0 ? 1 : Math.max(mobile ? 0.62 : 0.58, 0.82 - (distance - 1) * 0.13);
        const opacity = offset === 0 ? 1 : Math.max(0.24, 0.7 - (distance - 1) * 0.18);
        const blur = offset === 0 ? 0 : Math.min(2.2, 0.55 + distance * 0.45);

        card.style.transform = `translate(-50%, -50%) translate3d(${x}px, 0, ${z}px) rotateY(${rotateY}deg) scale(${scale})`;
        card.style.opacity = String(opacity);
        card.style.filter = `blur(${blur}px) saturate(${offset === 0 ? 1 : 0.78})`;
        card.style.zIndex = String(100 - distance);
        card.style.pointerEvents = distance &lt;= 1 ? 'auto' : 'none';
        card.classList.toggle('is-active', index === active);
        card.setAttribute('aria-hidden', index === active ? 'false' : 'true');
      });

      current.textContent = String(active + 1).padStart(2, '0');
      progress.style.width = `${((active + 1) / cards.length) * 100}%`;
    }

    function goTo(index) {
      active = (index + cards.length) % cards.length;
      updateCarousel();
    }

    window.collectionCarouselGoTo = goTo;
    window.collectionCarouselPrev = function () { goTo(active - 1); };
    window.collectionCarouselNext = function () { goTo(active + 1); };

    prev.type = 'button';
    next.type = 'button';
    prev.onclick = function (event) {
      event.preventDefault();
      event.stopPropagation();
      goTo(active - 1);
    };
    next.onclick = function (event) {
      event.preventDefault();
      event.stopPropagation();
      goTo(active + 1);
    };

    cards.forEach((card, index) =&gt; {
      card.addEventListener('click', function (event) {
        if (moved || event.target.closest('[data-add], button, a, [onclick]')) return;
        if (index !== active) goTo(index);
      });
    });

    stage.addEventListener('pointerdown', function (event) {
      if (event.target.closest('[data-add], button, a, [onclick]')) return;
      pointerId = event.pointerId;
      startX = event.clientX;
      moved = false;
      stage.setPointerCapture(pointerId);
      stage.classList.add('is-dragging');
    });

    stage.addEventListener('pointermove', function (event) {
      if (pointerId !== event.pointerId) return;
      if (Math.abs(event.clientX - startX) &gt; 6) moved = true;
    });

    function finishDrag(event) {
      if (pointerId !== event.pointerId) return;
      const delta = event.clientX - startX;
      try { stage.releasePointerCapture(pointerId); } catch (_) {}
      pointerId = null;
      stage.classList.remove('is-dragging');
      if (Math.abs(delta) &gt;= 40) goTo(active + (delta &lt; 0 ? 1 : -1));
      window.setTimeout(function () { moved = false; }, 0);
    }

    stage.addEventListener('pointerup', finishDrag);
    stage.addEventListener('pointercancel', function (event) {
      if (pointerId === event.pointerId) {
        pointerId = null;
        moved = false;
        stage.classList.remove('is-dragging');
      }
    });

    stage.addEventListener('wheel', function (event) {
      const amount = Math.abs(event.deltaX) &gt; Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
      if (Math.abs(amount) &lt; 8) return;
      const now = performance.now();
      if (now - lastWheel &lt; 420) return;
      event.preventDefault();
      lastWheel = now;
      goTo(active + (amount &gt; 0 ? 1 : -1));
    }, { passive: false });

    stage.addEventListener('pointermove', function (event) {
      if (pointerId !== null) return;
      const rect = stage.getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width - 0.5;
      section.style.setProperty('--collection-glow-x', `${50 + x * 15}%`);
    });

    stage.addEventListener('pointerleave', function () {
      section.style.setProperty('--collection-glow-x', '50%');
    });

    window.addEventListener('resize', updateCarousel, { passive: true });
    updateCarousel();
    requestAnimationFrame(updateCarousel);
    window.setTimeout(updateCarousel, 250);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initCollectionCarousel, { once: true });
  } else {
    initCollectionCarousel();
  }
  window.addEventListener('load', initCollectionCarousel, { once: true });
})();
